apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: joy-con-readers
  labels:
    app: joy-con-readers
spec:
  host: joy-con-readers.nintendovibes.com
  to:
    kind: Service
    name: joy-con-readers
  port:
    targetPort: http
  tls:
    termination: edge
    # Allow plain http: the Mac's Chrome is told to treat
    # http://joy-con-readers.nintendovibes.com as secure
    # (chrome://flags/#unsafely-treat-insecure-origin-as-secure), which is
    # what lets Web Bluetooth / WebHID work without a trusted certificate.
    insecureEdgeTerminationPolicy: Allow
