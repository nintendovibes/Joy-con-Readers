apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nintendo-vibes
  labels:
    app: nintendo-vibes
spec:
  host: nintendo-vibes.nintendovibes.com
  to:
    kind: Service
    name: nintendo-vibes
  port:
    targetPort: http
  tls:
    termination: edge
    # Allow plain http: the Mac's Chrome is told to treat
    # http://nintendo-vibes.nintendovibes.com as secure
    # (chrome://flags/#unsafely-treat-insecure-origin-as-secure), which is
    # what lets Web Bluetooth / WebHID work without a trusted certificate.
    insecureEdgeTerminationPolicy: Allow
    # The *.nintendovibes.com certificate is attached with
    # scripts/apply-route-cert.sh (kept out of git because of its key).
