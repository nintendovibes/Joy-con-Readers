apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nintendo-vibes
  labels:
    app: nintendo-vibes
spec:
  host: nintendo-vibes.nintendovibes.com
  to:
    kind: Service
    name: nintendo-vibes
  port:
    targetPort: http
  tls:
    termination: edge
    # http:// has no Web Bluetooth or WebHID, so always send to https.
    insecureEdgeTerminationPolicy: Redirect
    # The *.nintendovibes.com certificate is attached with
    # scripts/apply-route-cert.sh (kept out of git because of its key).
